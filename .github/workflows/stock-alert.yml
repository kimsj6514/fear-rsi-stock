name: Fear-RSI STOCK alerts
on:
  schedule:
    - cron: '40 1,3,5,7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식 (test는 텔레그램 테스트 1회만 발송)'
        type: choice
        required: true
        default: scan
        options:
          - scan
          - test
permissions:
  contents: write
concurrency:
  group: fear-rsi-stock
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyze and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_CODES: ${{ vars.WATCH_CODES }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "test" ]; then
            python notify.py --test-telegram
          else
            python notify.py
          fi
      - name: Persist alert state
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'test')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock_alert_state.json stock_signal_history.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update stock alert history [skip ci]'
            git pull --rebase
            git push
          fi
